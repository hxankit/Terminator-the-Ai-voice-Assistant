# Reverse proxy for Terminator (FastAPI serves both the API and the built frontend on :8000).
server {
    listen 443 ssl http2;
    server_name assistant.example.com;
    # ssl_certificate / ssl_certificate_key: e.g. from certbot

    client_max_body_size 30m;            # > MAX_UPLOAD_MB

    location /api/ws {                   # WebSocket (two-way channel)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # SSE streaming endpoint
        proxy_read_timeout 300s;
    }
}
